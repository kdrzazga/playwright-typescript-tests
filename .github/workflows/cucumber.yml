name: Cucumber BDD Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps ${{ matrix.browser }}
    - name: Run Cucumber BDD tests
      env:
        BROWSER: ${{ matrix.browser }}
      run: npx cucumber-js --format summary --format "html:cucumber-report-${{ matrix.browser }}.html"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: cucumber-report-${{ matrix.browser }}
        path: cucumber-report-${{ matrix.browser }}.html
        retention-days: 30
